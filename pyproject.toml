[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "h1cli"
version = "0.1.0"
description = "CLI for the HackerOne Hacker API (personal token, HTTP Basic)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ImAno177" }]
keywords = ["hackerone", "bugbounty", "cli", "api"]
classifiers = [
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/ImAno177/h1cli"
Documentation = "https://api.hackerone.com/getting-started-hacker-api/"

[project.scripts]
h1cli = "h1cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
